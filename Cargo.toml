[package]
name = "cosmic-ext-calendar"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-only"
description = "A calendar application for the COSMIC desktop"
repository = "https://github.com/cosmic-utils/cosmic-ext-calendar"

[build-dependencies]
vergen = { version = "8", features = ["git", "gitcl"] }

[dependencies]
accounts = { git = "https://github.com/cosmic-ext-orbit/cosmic-ext-accounts", features = ["calendar", "libcosmic"] }
chrono = "0.4"
chrono-tz = "0.10"
css-color = "0.2.8"
directories = "5"
iana-time-zone = "0.1"
jiff = { version = "0.2", default-features = false }
i18n-embed-fl = "0.9.2"
icalendar = { version = "0.17.13", features = ["time", "parser"] }
notify-rust = "4.18.0"
open = "5.3.0"
roxmltree = "0.20"
rrule = { version = "0.14.0", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
time = { version = "0.3.44", features = ["serde", "local-offset"] }
tokio = { version = "1.41.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dependencies.i18n-embed]
version = "0.15"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    "about",
    # Accessibility support
    "a11y",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
    # Add Wayland support to winit
    "wayland",
    # GPU-accelerated rendering
    "wgpu",
    # Native file dialogs (used for ICS import/export)
    "xdg-portal",
]

[target.'cfg(any(target_os = "macos", windows))'.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["rfd"]

